# shellcheck shell=bash
# StartFSGUI's settings for the devkit (scripts/devkit, a submodule; docs/testing.md): the test session, the tours and the recorder.
TOUR_TITLE=StartFSGUI
TOUR_PLUGIN_ID=io.github.bmaltais.startfsgui
DEVKIT_NAME=startfsgui
DEVKIT_LAYERS=(omarchy-startfsgui)
# The session shares your user's systemd and your real StartFS daemon (a live cluster). Demo mode serves a fixture status and
# writes config changes to a file of its own; `startfs` is never run.
DEVKIT_ENV=(STARTFSGUI_DEMO=1)
TOUR_SANDBOX_COPY=()
TOUR_SANDBOX_LINK=(.local/share/icons)
TOUR_REAL_UNCHANGED=(.config/omarchy/shell.json .config/startfs .config/startfsgui .local/share/startfs)

devkit_sandbox() {
  local h=$1
  mkdir -p "$h/.config/startfsgui/demo"; : >"$h/.config/startfsgui/demo/ENABLED"
  [[ -f $h/.config/startfsgui/demo/ENABLED ]] || { echo "the sandbox could not be put in demo mode" >&2; return 1; }
}

DEVKIT_USAGE='  dev open | close      open or close the manager there'
dev_cmd_open() { nenv omarchy-shell -q "$ID" close 2>/dev/null || true; sleep 0.4; dev_window open "$ID" open; }
dev_cmd_close() { nenv omarchy-shell "$ID" close >/dev/null; echo "dev close: closed"; }

DEVKIT_RELOAD_READY=state
reload_open() {
  case $1 in
    open) omarchy-shell -q "$ID" close || true; sleep 0.4; omarchy-shell "$ID" open >/dev/null ;;
    *) die "unknown window $1 (open)" ;;
  esac
}

icons() {
  local hits
  hits=$(grep -nE 'iconText: *""' ./*.qml || true)
  [[ -z $hits ]] || { echo "empty iconText (an icon lost its glyph; write icons as \\uXXXX escapes):"; echo "$hits"; return 1; }
}
devkit_check() {
  step "CLI behaviour (tests/cli.sh)" tests/cli.sh
  step "status parser (node --test)" node --test
  step "QML icons (no empty iconText)" icons
}
